name: Production Release & Deploy

# Trigger deployment on git version tags (e.g. v0.1.0) or manual workflow dispatch
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

# Grant write permissions to create GitHub Releases and upload release assets
permissions:
  contents: write

jobs:
  # ============================================================================
  # STAGE 1: Build, Test, and Artifact Packaging
  # ============================================================================
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      has_vsce: ${{ steps.check_secrets.outputs.has_vsce }}
      has_ovsx: ${{ steps.check_secrets.outputs.has_ovsx }}
    steps:
      # Step 1: Pull repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Bun runtime environment
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 3: Install project dependencies from lockfile
      - name: Install dependencies
        run: bun install

      # Step 4: Run Prettier formatting check
      - name: Verify code style
        run: bun run format:check

      # Step 5: Run automated test suite
      - name: Run automated test suite
        run: bun test

      # Step 6: Compile and package extension into production tokenlens.vsix
      - name: Build extension package (.vsix)
        run: bun run build

      # Generate cryptographic checksum for release artifact verification
      - name: Generate SHA-256 Checksum
        run: sha256sum tokenlens.vsix > tokenlens.vsix.sha256

      # Step 8: Upload release assets to workflow artifacts for downstream jobs
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            tokenlens.vsix
            tokenlens.vsix.sha256
          retention-days: 7

      # Step 9: Check available publishing secrets for downstream job conditions
      - name: Check publishing secrets
        id: check_secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "has_vsce=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vsce=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$OVSX_PAT" ]; then
            echo "has_ovsx=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ovsx=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # STAGE 2A: Publish GitHub Release (with VSIX binary & SHA-256 checksum)
  # ============================================================================
  publish-github-release:
    name: publish-github-release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull repository source code for git context
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 3: Publish GitHub Release with VSIX binary (uses v3 with Node 24 upload hardening)
      - name: Publish GitHub Release with VSIX binary
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            tokenlens.vsix
            tokenlens.vsix.sha256
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 2B: Publish to Visual Studio Marketplace
  # ============================================================================
  publish-marketplace:
    name: publish-marketplace
    needs: [build]
    if: needs.build.outputs.has_vsce == 'true'
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Bun runtime environment
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 3: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 4: Publish to Visual Studio Marketplace
      - name: Publish to Visual Studio Marketplace
        run: bunx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # ============================================================================
  # STAGE 2C: Publish to Open VSX Registry (Cursor / VSCodium / Windsurf)
  # ============================================================================
  publish-openvsx:
    name: publish-openvsx
    needs: [build]
    if: needs.build.outputs.has_ovsx == 'true'
    runs-on: ubuntu-latest
    steps:
      # Step 1: Install Bun runtime environment
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 2: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 3: Publish to Open VSX Registry
      - name: Publish to Open VSX Registry
        run: bunx ovsx publish tokenlens.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # ============================================================================
  # STAGE 2D: Report Release Build Status & Checksum Summary
  # ============================================================================
  report-build-status:
    name: report-build-status
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 2: Publish a rich summary card with checksum to the release summary
      - name: Generate release summary
        run: |
          echo "### Release Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ github.event.inputs.release_tag || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Checksum**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat tokenlens.vsix.sha256 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
