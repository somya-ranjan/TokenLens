name: Production Release & Deploy

# Trigger deployment on git version tags (e.g. v0.1.0) or manual workflow dispatch
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

# Grant write permissions to create GitHub Releases and upload release assets
permissions:
  contents: write

jobs:
  # ============================================================================
  # STAGE 1: Build, Test, and Artifact Packaging
  # ============================================================================
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Bun runtime environment
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 3: Install project dependencies from lockfile
      - name: Install dependencies
        run: bun install

      # Step 4: Run Prettier formatting check
      - name: Verify code style
        run: bun run format:check

      # Step 5: Run automated test suite
      - name: Run automated test suite
        run: bun test

      # Step 6: Compile and package extension into production tokenlens.vsix
      - name: Build extension package (.vsix)
        run: bun run build

      # Generate cryptographic checksum for release artifact verification
      - name: Generate SHA-256 Checksum
        run: sha256sum tokenlens.vsix > tokenlens.vsix.sha256

      # Step 8: Upload release assets to workflow artifacts for downstream jobs
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            tokenlens.vsix
            tokenlens.vsix.sha256
          retention-days: 7

  # ============================================================================
  # STAGE 2A: Publish GitHub Release (with VSIX binary & SHA-256 checksum)
  # ============================================================================
  publish-github-release:
    name: publish-github-release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 2: Publish GitHub Release using native GitHub CLI (Fast, zero Node stream hang)
      - name: Publish GitHub Release with VSIX binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG_NAME" tokenlens.vsix tokenlens.vsix.sha256 \
            --title "$TAG_NAME" \
            --generate-notes || \
          gh release upload "$TAG_NAME" tokenlens.vsix tokenlens.vsix.sha256 --clobber

  # ============================================================================
  # STAGE 2B: Publish to Visual Studio Marketplace
  # ============================================================================
  publish-marketplace:
    name: publish-marketplace
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Bun runtime environment
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 3: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 4: Publish to Visual Studio Marketplace if secret (VSCE_PAT) is present
      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: bunx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Step 5: Inform if secret is not yet configured
      - name: Skip marketplace publish if token not set
        if: env.VSCE_PAT == ''
        run: echo "VSCE_PAT secret not configured. Skipping Visual Studio Marketplace upload."
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # ============================================================================
  # STAGE 2C: Publish to Open VSX Registry (Cursor / VSCodium / Windsurf)
  # ============================================================================
  publish-openvsx:
    name: publish-openvsx
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Step 1: Install Bun runtime environment
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Step 2: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 3: Publish to Open VSX Registry if secret (OVSX_PAT) is present
      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: bunx ovsx publish tokenlens.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # Step 4: Inform if secret is not yet configured
      - name: Skip Open VSX publish if token not set
        if: env.OVSX_PAT == ''
        run: echo "OVSX_PAT secret not configured. Skipping Open VSX upload."
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # ============================================================================
  # STAGE 2D: Report Release Build Status & Checksum Summary
  # ============================================================================
  report-build-status:
    name: report-build-status
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download release artifacts from Stage 1
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      # Step 2: Publish a rich summary card with checksum to the release summary
      - name: Generate release summary
        run: |
          echo "### Release Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ github.event.inputs.release_tag || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Checksum**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat tokenlens.vsix.sha256 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
